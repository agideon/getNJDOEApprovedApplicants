services:
  app:
    volumes:
      # These are mounted from the host so, for development, one can
      # simply edit these are re-run w/o having to rebuild a container
      # image.  Note that the Dockerfile is copying these into the
      # image, but this specification of volumes in the .override.
      # file is hiding the copied content with this mounted content.
      - ${PWD:-.}/app/bin:/app/bin:z
      # Like ${PWD} above, ~ and ${XDG_RUNTIME_DIR} are interpolated in
      # whatever environment `podman compose` actually runs in. Left as
      # invoked from inside the Claude container's own environment
      # (HOME=/root, no XDG_RUNTIME_DIR set), they'd resolve to
      # /root/.claude* and /podman/podman.sock, neither of which exist
      # on the host. The invocation itself must remap them to host
      # values (HOME=$HOST_HOME XDG_RUNTIME_DIR=$HOST_XDG_RUNTIME_DIR),
      # exactly like the existing `PWD=$HOST_PWD` prefix does for ${PWD}
      # above — see CLAUDE.md for the full command.
      - ~/.claude.json:/home/u0/.claude.json:z
      - ~/.claude:/home/u0/.claude:Z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:z
    environment:
      - COMPOSE_PARAM_HOST_IMAGE_VOLUMES=true
      - TZ=${TZ:-America/New_York}
      - HOST_PWD=${HOST_PWD}
      - CLAUDE_PROJECT_NAME=${CLAUDE_PROJECT_NAME}



  # Re-locks app/pip/Pipfile.lock against app/pip/Pipfile. Only needed
  # when adding/removing/re-pinning a package (edit Pipfile first) or to
  # pick up newer versions within Pipfile's existing constraints.
  # `profiles:` keeps this out of a bare `up`/`up -d --build`; run it
  # explicitly with:
  #   podman compose --profile update-requirements run --rm update-requirements
  # (explicitly naming a service starts it regardless of profile, so
  # `--profile` isn't strictly required here, but it documents intent
  # and is cheap insurance against a future plain `up` picking it up.)
  update-requirements:
    build:
      context: app
      # Only needs pipenv itself, not the app's own code/dependencies —
      # see the pipenvbase comment in app/Dockerfile.
      target: pipenvbase
    container_name: background-check-update-requirements
    restart: "no"
    profiles: ["update-requirements"]
    # pipenv lock writes Pipfile.lock back into the bind-mounted
    # app/pip directory below, which is root-owned on the host; the
    # image's default USER (u0, non-root) has no write access there
    # under rootless Podman's UID mapping. Same tradeoff as documented
    # for lock-requirements previously: no untrusted input here, so
    # root is simpler than rejiggering host file ownership.
    user: root
    working_dir: /app/pip
    volumes:
      - ${PWD:-.}/app/pip:/app/pip:z
    command: pipenv lock
